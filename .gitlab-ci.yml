stages:
  - build
  - test

.py36: &py36
  image: quay.io/pypa/manylinux1_x86_64
  variables:
    PYVER: "cp36-cp36m"


.py37: &py37
  image: quay.io/pypa/manylinux1_x86_64
  variables:
    PYVER: "cp37-cp37m"

.test:
  stage: test
  script:
  - ./test.sh

test-3.6:
  <<: *py36
  extends: .test

test-3.7:
  <<: *py37
  extends: .test


devel:
  image: quay.io/pypa/manylinux1_x86_64
  stage: build
  script:
  - ./build_wheels.sh
  artifacts:
    paths:
    - ./*.whl
    expire_in: 8 hours
  except:
  - tags

release:
  image: quay.io/pypa/manylinux1_x86_64
  stage: build
  script:
  - ./build_wheels.sh
  artifacts:
    paths:
    - ./*.whl
    expire_in: 1000 years
  only:
  - tags
